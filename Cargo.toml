[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
libproc = "0.14.11"
ratatui = "0.30.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
