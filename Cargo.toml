[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
